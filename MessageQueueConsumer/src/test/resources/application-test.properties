# Test environment settings
spring.application.name=Message Queue Management Consumer Portal (Test)
server.servlet.context-path=/message-queue-management-consumer-portal/v1
server.port=0

# H2 In-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# RabbitMQ test settings (using test container or mock)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Disable rabbit listener for tests
spring.rabbitmq.listener.simple.auto-startup=false

# Show SQL queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.example.MessageQueueConsumer=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# RabbitMQ queue names
user.rabbitmq.queue=user_queue_test
user.rabbitmq.direct_exchange=user_direct_exchange_test
user.rabbitmq.topic_exchange=user_topic_exchange_test
user.rabbitmq.fanout_exchange=user_fanout_exchange_test
user.rabbitmq.routing_key=user_routing_key_test

# Constants
app.message=Message is successfully sent (test)